# Tokyo Night Storm

[mgr]
cwd = { fg = "#a9b1d6", italic = true }
hovered = { bg = "#292e42" }
preview_hovered = { bg = "#292e42" }
find_keyword = { fg = "#1f2335", bg = "#ff9e64", bold = true }
find_position = { fg = "#7dcfff", bg = "#1f2335", bold = true }
marker_copied = { fg = "#9ece6a", bg = "#9ece6a" }
marker_cut = { fg = "#f7768e", bg = "#f7768e" }
marker_marked = { fg = "#bb9af7", bg = "#bb9af7" }
marker_selected = { fg = "#7aa2f7", bg = "#7aa2f7" }
count_copied = { fg = "#1f2335", bg = "#9ece6a" }
count_cut = { fg = "#1f2335", bg = "#f7768e" }
count_selected = { fg = "#1f2335", bg = "#7aa2f7" }
border_symbol = "│"
border_style = { fg = "#7dcfff" }

[tabs]
active = { fg = "#1f2335", bg = "#7aa2f7" }
inactive = { fg = "#7aa2f7", bg = "#292e42" }

[mode]
normal_main = { fg = "#1f2335", bg = "#7aa2f7", bold = true }
normal_alt = { fg = "#7aa2f7", bg = "#292e42" }
select_main = { fg = "#1f2335", bg = "#bb9af7", bold = true }
select_alt = { fg = "#bb9af7", bg = "#292e42" }

[status]
overall = { fg = "#c0caf5", bg = "#1f2335" }
progress_label = { fg = "#c0caf5", bold = true }
progress_normal = { fg = "#3d59a1", bg = "#292e42" }
progress_error = { fg = "#f7768e", bg = "#292e42" }
perm_type = { fg = "#7aa2f7" }
perm_read = { fg = "#e0af68" }
perm_write = { fg = "#f7768e" }
perm_exec = { fg = "#9ece6a" }
perm_sep = { fg = "#565f89" }

[pick]
border = { fg = "#7dcfff" }
active = { fg = "#c0caf5", bg = "#3d59a1" }
inactive = { fg = "#c0caf5" }

[input]
border = { fg = "#7dcfff" }
title = { fg = "#7dcfff" }
value = { fg = "#bb9af7" }
selected = { bg = "#3d59a1" }

[cmp]
border = { fg = "#7dcfff" }
active = { fg = "#c0caf5", bg = "#292e42" }
inactive = { fg = "#c0caf5" }

[tasks]
border = { fg = "#7dcfff" }
title = { fg = "#7dcfff" }
hovered = { fg = "#c0caf5", bg = "#3d59a1" }

[which]
cols = 3
mask = { bg = "#1f2335" }
cand = { fg = "#7dcfff" }
rest = { fg = "#7aa2f7" }
desc = { fg = "#bb9af7" }
separator = " ➜ "
separator_style = { fg = "#565f89" }

[confirm]
border = { fg = "#7dcfff" }
title = { fg = "#7dcfff" }
btn_yes = { bg = "#3d59a1" }
btn_labels = [ "  [Y]es  ", "  (N)o  " ]

[spot]
border = { fg = "#7dcfff" }
title = { fg = "#7dcfff" }

[notify]
title_info = { fg = "#7dcfff" }
title_warn = { fg = "#e0af68" }
title_error = { fg = "#f7768e" }

[help]
on = { fg = "#9ece6a" }
run = { fg = "#bb9af7" }
desc = { fg = "#7dcfff" }
hovered = { bg = "#292e42" }
footer = { fg = "#c0caf5", bg = "#24283b" }

[filetype]
rules = [
  { mime = "image/*", fg = "#e0af68" },
  { mime = "{audio,video}/*", fg = "#bb9af7" },
  { mime = "application/*zip", fg = "#f7768e" },
  { mime = "application/x-{tar,bzip*,7z-compressed,xz,rar}", fg = "#f7768e" },
  { mime = "application/{pdf,doc,rtf,vnd.*}", fg = "#7dcfff" },
  { url = "*", is = "orphan", bg = "#f7768e" },
  { url = "*", is = "exec", fg = "#9ece6a" },
  { url = "*/", fg = "#7aa2f7" },
  { url = "*", fg = "#c0caf5" }
]
