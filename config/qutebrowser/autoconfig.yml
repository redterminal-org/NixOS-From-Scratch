# If a config.py file exists, this file is ignored unless it's explicitly loaded
# via config.load_autoconfig(). For more information, see:
# https://github.com/qutebrowser/qutebrowser/blob/main/doc/help/configuring.asciidoc#loading-autoconfigyml
# DO NOT edit this file by hand, qutebrowser will overwrite it.
# Instead, create a config.py - see :help for details.

config_version: 2
settings:
  auto_save.session:
    global: true
  bindings.commands:
    global:
      normal:
        ',i': hint images download
        ',v': hint links spawn mpv {hint-url}
        <Backspace>: :back
        <Shift+Left>: tab-prev
        <Shift+Right>: tab-next
        C: tab-close
        J: tab-prev
        K: tab-next
        q: null
        tab-next: K
        xb: config-cycle statusbar.show always never
        xt: config-cycle tabs.show always never
        xx: config-cycle statusbar.show always never;; config-cycle tabs.show always
          never
  content.blocking.adblock.lists:
    global: []
  content.blocking.hosts.lists:
    global: []
  content.cookies.accept:
    global: no-3rdparty
  content.local_content_can_access_remote_urls:
    global: true
  content.notifications.enabled:
    https://iridum.redterminal.org: true
    https://webclient.iridum.redterminal.org: true
  content.notifications.presenter:
    global: libnotify
  content.register_protocol_handler:
    https://mail.proton.me#mailto=%25s: false
  content.unknown_url_scheme_policy:
    global: allow-all
  downloads.location.directory:
    global: ~/Downloads
  downloads.open_dispatcher:
    global: xdg-open
  fonts.default_size:
    global: 14pt
  fonts.web.family.fixed:
    global: null
  fonts.web.family.standard:
    global: null
  fonts.web.size.default_fixed:
    global: 14
  qt.workarounds.disable_hangouts_extension:
    global: true
  statusbar.show:
    global: always
  tabs.show:
    global: always
  url.searchengines:
    global:
      DEFAULT: https://www.startpage.com/do/search?query={}
      asn: https://api.hackertarget.com/aslookup/?q={}
      br: https://search.brave.com/search?q={}
      de: https://de.thefreedictionary.com/{}
      ody: https://odysee.com/$/search?q={}
      q: https://lite.qwant.com/?q={}
      tr: https://www.linguee.com/english-german/search?source=auto&query={}
      ts: https://www.openthesaurus.de/synonyme/{}
      wp: https://de.wikipedia.org/w/index.php?search={}
      yt: https://inv.thepixora.com/search?q={}
  zoom.default:
    global: 125%
