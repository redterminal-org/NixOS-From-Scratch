# Tokyo Night

[colors.primary]
background = "#1a1b26"
foreground = "#c0caf5"

[colors.normal]
black = "#15161e"
red = "#f7768e"
green = "#9ece6a"
yellow = "#e0af68"
blue = "#7aa2f7"
magenta = "#bb9af7"
cyan = "#7dcfff"
white = "#a9b1d6"

[colors.bright]
black = "#414868"
red = "#ff899d"
green = "#9fe044"
yellow = "#faba4a"
blue = "#8db0ff"
magenta = "#c7a9ff"
cyan = "#a4daff"
white = "#c0caf5"

[env]
TERM = "xterm-256color"

[font]
size = 14.0

[font.normal]
family = "JetBrainsMono Nerd Font Mono"
#family = "JetBrainsMonoNL Nerd Font Mono"

[font.offset]
x = 0
y = 0

[window]
opacity = 1.0
padding = {x = 0, y = 0}
dynamic_padding = true
class = {instance = "alacritty", general = "OnTop"}

[cursor]
style = {shape = "Beam", blinking = "Always"}
blink_timeout = 0
