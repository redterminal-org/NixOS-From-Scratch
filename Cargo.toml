[package]
name = "esp32-rust-arduino"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
esp-idf-sys = { version = "=0.36.1", features = ["binstart"] }

[build-dependencies]
embuild = "=0.33.1"

[package.metadata.esp-idf-sys]
esp_idf_version = "tag:v5.1.4"
esp_idf_sdkconfig_defaults = ["idf/sdkconfig.defaults"]

[[package.metadata.esp-idf-sys.extra_components]]
component_dirs = ["idf/components/rust_arduino_bridge"]
